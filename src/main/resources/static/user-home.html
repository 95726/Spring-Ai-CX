<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - Spring AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: #999;
            font-size: 14px;
        }

        .user-info-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .user-name {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .user-id {
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .action-section {
            margin-top: 30px;
        }

        .action-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-action {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-chat {
            background: #667eea;
            color: white;
        }

        .btn-chat:hover {
            background: #5a6fd6;
        }

        .btn-history {
            background: #f093fb;
            color: white;
        }

        .btn-history:hover {
            background: #e082ea;
        }

        .btn-logout {
            background: #ff6b6b;
            color: white;
        }

        .btn-logout:hover {
            background: #ee5a5a;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>正在加载...</p>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <div class="header">
            <h1>Spring AI Chat</h1>
            <p class="subtitle">智能对话助手</p>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;"></div>

        <div class="user-info-card">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-name" id="userName">用户名</div>
            <div class="user-id" id="userId">用户ID: --</div>
        </div>

        <div class="action-section">
            <h2>快捷操作</h2>
            <div class="action-buttons">
                <button class="btn-action btn-chat" onclick="goToChat()">
                    <span>开始对话</span>
                </button>
                <button class="btn-action btn-history" onclick="goToHistory()">
                    <span>对话历史</span>
                </button>
                <button class="btn-action btn-logout" onclick="handleLogout()">
                    <span>退出登录</span>
                </button>
            </div>
        </div>

        <div class="footer">
            <p>Spring AI Chat Demo v1.0</p>
        </div>
    </div>

    <script>
        /**
         * 初始化页面，检查用户登录状态
         */
        async function init() {
            try {
                const response = await fetch('/api/auth/current');
                const data = await response.json();

                if (data.success) {
                    // 显示用户信息
                    document.getElementById('userName').textContent = data.userName;
                    document.getElementById('userId').textContent = '用户ID: ' + data.userId;
                    // 设置头像首字母
                    document.getElementById('userAvatar').textContent = data.userName.charAt(0).toUpperCase();

                    // 隐藏加载，显示主内容
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';
                } else {
                    // 未登录，跳转到登录页
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
                window.location.href = '/login.html';
            }
        }

        /**
         * 跳转到聊天页面
         */
        function goToChat() {
            window.location.href = '/index.html';
        }

        /**
         * 跳转到历史记录页面
         */
        function goToHistory() {
            window.location.href = '/conversation.html';
        }

        /**
         * 处理登出请求
         */
        async function handleLogout() {
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    // 跳转到登录页
                    window.location.href = '/login.html';
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            }
        }

        /**
         * 显示错误消息
         */
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // 初始化
        init();
    </script>
</body>
</html>

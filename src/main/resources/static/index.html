<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Chat Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .session-info {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0f4ff;
            border-radius: 8px;
        }

        .session-id {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .session-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-session {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-new-session {
            background: #f093fb;
            color: white;
        }

        .btn-new-session:hover {
            background: #e082ea;
        }

        .btn-history {
            background: #667eea;
            color: white;
        }

        .btn-history:hover {
            background: #5a6fd6;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .history-section {
            flex: 1;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .history-section h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message-item {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-item.user {
            background: #667eea;
            color: white;
            margin-left: 60px;
        }

        .message-item.assistant {
            background: #f0f0f0;
            color: #333;
            margin-right: 60px;
        }

        .message-item .sender {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .message-item.user .sender {
            text-align: right;
        }

        .input-section {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-section textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            min-height: 60px;
            max-height: 120px;
            transition: border-color 0.3s;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-stream {
            background: #f093fb;
            color: white;
        }

        .btn-stream:hover {
            background: #e082ea;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #ff6b6b;
            color: white;
        }

        .btn-clear:hover {
            background: #ee5a5a;
        }

        .status-bar {
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .status-bar.idle {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-bar.loading {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-bar.error {
            background: #ffebee;
            color: #c62828;
        }

        .typing-indicator {
            display: none;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: #f0f0f0;
            color: #666;
            font-size: 14px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .empty-hint {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spring AI Chat Demo</h1>

        <div class="session-info">
            <div class="session-id" id="sessionIdDisplay">当前会话：未创建</div>
            <div class="session-actions">
                <button class="btn-session btn-new-session" onclick="createNewSession()">新建会话</button>
                <button class="btn-session btn-history" onclick="viewHistory()">查看历史</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="history-section" id="historySection">
                <div class="empty-hint" id="emptyHint">发送消息开始对话</div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <span class="typing-dots">AI 正在思考</span>
            </div>
        </div>

        <div class="input-section">
            <textarea id="messageInput" placeholder="请输入您的问题..."></textarea>
            <div class="button-group">
                <button class="btn btn-stream" id="btnStream" onclick="sendStreamRequest()">发送</button>
                <button class="btn btn-clear" onclick="clearResponse()">清空</button>
            </div>
        </div>

        <div class="status-bar idle" id="statusBar">状态：就绪</div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const statusBar = document.getElementById('statusBar');
        const sessionIdDisplay = document.getElementById('sessionIdDisplay');
        const historySection = document.getElementById('historySection');
        const emptyHint = document.getElementById('emptyHint');
        const typingIndicator = document.getElementById('typingIndicator');
        const btnStream = document.getElementById('btnStream');

        let currentSessionId = null;
        let streamCompleted = false;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionIdFromUrl = urlParams.get('sessionId');

            if (sessionIdFromUrl) {
                currentSessionId = sessionIdFromUrl;
                sessionIdDisplay.textContent = '当前会话：' + sessionIdFromUrl;
                loadSessionHistory(sessionIdFromUrl);
            } else {
                sessionIdDisplay.textContent = '当前会话：未创建（发送消息时自动创建）';
            }
        }

        async function loadSessionHistory(sessionId) {
            try {
                const response = await fetch(`/api/conversation/${sessionId}`);
                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    emptyHint.style.display = 'none';
                    historySection.innerHTML = data.messages.map(msg => `
                        <div class="message-item ${msg.role}">
                            <div class="sender">${msg.role === 'user' ? '用户' : '助手'}</div>
                            ${escapeHtml(msg.content)}
                        </div>
                    `).join('');
                    scrollToBottom();
                }
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            historySection.scrollTop = historySection.scrollHeight;
        }

        function createNewSession() {
            currentSessionId = null;
            sessionIdDisplay.textContent = '当前会话：未创建（发送消息时自动创建）';
            historySection.innerHTML = '<div class="empty-hint" id="emptyHint">发送消息开始对话</div>';
            clearResponse();
            window.history.replaceState({}, '', '/index.html');
        }

        function viewHistory() {
            window.location.href = '/conversation.html';
        }

        function setButtonsDisabled(disabled) {
            btnStream.disabled = disabled;
        }

        function setStatus(text, type) {
            statusBar.textContent = '状态：' + text;
            statusBar.className = 'status-bar ' + type;
        }

        function showTyping() {
            typingIndicator.classList.add('active');
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function clearResponse() {
            if (emptyHint) {
                emptyHint.style.display = 'block';
            }
            historySection.innerHTML = '<div class="empty-hint" id="emptyHint">发送消息开始对话</div>';
            setStatus('就绪', 'idle');
            streamCompleted = false;
        }

        function addMessage(role, content) {
            let hint = document.getElementById('emptyHint');
            if (hint) {
                hint.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-item ' + role;
            messageDiv.innerHTML = `
                <div class="sender">${role === 'user' ? '用户' : '助手'}</div>
                ${escapeHtml(content)}
            `;
            historySection.appendChild(messageDiv);
            scrollToBottom();
        }

        function parseStreamData(data) {
            if (data.startsWith('data:')) {
                return data.substring(5).trim();
            }
            return data;
        }

        function sendStreamRequest() {
            const message = messageInput.value.trim();
            if (!message) {
                alert('请输入消息');
                return;
            }

            streamCompleted = false;
            setButtonsDisabled(true);
            setStatus('AI 思考中...', 'loading');
            showTyping();

            const requestBody = {
                message: message,
                sessionId: currentSessionId
            };

            fetch('/api/chat/stream/context', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            }).then(response => {
                if (!response.ok) {
                    console.error('请求失败:', response.status, response.statusText);
                    setStatus('请求失败: ' + response.status, 'error');
                    setButtonsDisabled(false);
                    hideTyping();
                    return;
                }

                hideTyping();
                setStatus('正在生成...', 'loading');
                addMessage('user', message);
                messageInput.value = '';

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullResponse = '';
                let assistantMessageEl = null;
                let assistantContentEl = null;

                // 创建占位的 assistant 消息
                function createAssistantMessage() {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message-item assistant';
                    msgDiv.innerHTML = `
                        <div class="sender">助手</div>
                        <div class="content"></div>
                    `;
                    assistantContentEl = msgDiv.querySelector('.content');
                    historySection.appendChild(msgDiv);
                    assistantMessageEl = msgDiv;
                    scrollToBottom();
                }

                createAssistantMessage();

                function read() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            streamCompleted = true;
                            setStatus('完成', 'idle');
                            setButtonsDisabled(false);
                            return;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.trim() === '' || line.trim() === 'data:') continue;

                            const data = parseStreamData(line);

                            if (data === '[DONE]') {
                                streamCompleted = true;
                                setStatus('完成', 'idle');
                                setButtonsDisabled(false);
                                continue;
                            }

                            try {
                                const sessionData = JSON.parse(data);
                                if (sessionData.sessionId) {
                                    currentSessionId = sessionData.sessionId;
                                    sessionIdDisplay.textContent = '当前会话：' + sessionData.sessionId;
                                    continue;
                                }
                            } catch (e) {
                                fullResponse += data;
                                if (assistantContentEl) {
                                    assistantContentEl.textContent = fullResponse;
                                    scrollToBottom();
                                }
                            }
                        }

                        read();
                    }).catch(error => {
                        console.error('读取错误:', error);
                        if (!streamCompleted) {
                            setStatus('错误', 'error');
                            setButtonsDisabled(false);
                            hideTyping();
                        }
                    });
                }

                read();
            }).catch(error => {
                console.error('请求错误:', error);
                setStatus('请求失败', 'error');
                setButtonsDisabled(false);
                hideTyping();
            });
        }

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendStreamRequest();
            }
        });

        init();
    </script>
</body>
</html>
